<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JMS Analyzer{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- ================================
         NAVIGATION BAR
    ================================= -->

    <nav class="navbar">

        <div class="nav-logo">
            JMS ANALYZER
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('user_type') }}">
                Analyze
            </a>

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('history') }}">
                History
            </a>

        </div>

    </nav>


    <!-- ================================
         PAGE CONTENT
    ================================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <p>
            JMS Analyzer • Job Market Skill Analysis
        </p>

    </footer>

</body>

</html>
